<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Countdown Surprise</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      background: url('https://i.pinimg.com/originals/f4/40/1c/f4401cb2a9177a89b153431e00f63f45.gif') center/cover no-repeat;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: 'Comic Sans MS', cursive;
      color: #fff;
      text-shadow: 1px 1px 3px #000;
      text-align: center;
    }

    h1 {
      font-size: 2.5em;
      margin-bottom: 20px;
    }

    #countdown {
      font-size: 6em;
      color: #ff4081;
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }

    p {
      font-size: 1.5em;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <h1>Get Ready Pari Sharma 😍</h1>
  <div id="countdown">15</div>
  <p>Something beautiful is coming just for you...</p>

  <script>
    window.onload = function () {
      let count = 15;
      const countdownElement = document.getElementById("countdown");
      countdownElement.textContent = count;

      const interval = setInterval(() => {
        count--;
        countdownElement.textContent = count;

        if (count === 0) {
          clearInterval(interval);
          // Redirect to surprise.html
          window.location.href = "surprise.html";
        }
      }, 1000);
    };
  </script>
</body>
</html>
